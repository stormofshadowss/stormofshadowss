<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GOM — StormOfShadowss</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#f1eefc">
  <script src="/site/theme.js"></script>
</head>
<body class="admin">
  <header class="top"><span class="brand">StormOf<span>Shadowss</span></span> <span class="muted">· GOM</span> <span class="top-links"><a href="/" target="_blank" rel="noopener" data-view-site>View the shop ↗</a> <a href="/my.html" target="_blank" rel="noopener">View My orders ↗</a></span></header>

  <main id="loginView" hidden>
    <section class="card">
      <h1>GOM sign-in</h1>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMsg" class="msg" hidden></p>
      <p class="muted">Joiner? <a href="/">Sign in with your email here</a>.</p>
    </section>
  </main>

  <div id="appView" hidden>
    <nav class="tabs" id="tabs"></nav>
    <main class="wide"><div id="tabBody"></div>
      <p class="foot"><span id="whoami" class="muted"></span> · <button id="logout" class="ghost small sm">Sign out</button> · <a href="/preview.html">Design preview</a> · <button type="button" class="themebtn" data-theme-toggle style="margin:0"></button></p>
    </main>
  </div>
  <div id="toast" hidden></div>

  <script src="/gom/core.js"></script>
  <script src="/gom/orders.js"></script>
  <script src="/gom/claims.js"></script>
  <script src="/gom/sets.js"></script>
  <script src="/gom/payments.js"></script>
  <script src="/gom/proxy.js"></script>
  <script src="/gom/warehouse.js"></script>
  <script src="/gom/shop.js"></script>
  <script src="/gom/packing.js"></script>
  <script src="/gom/overdue.js"></script>
  <script src="/gom/people.js"></script>
  <script src="/gom/import.js"></script>
  <script src="/gom/launch.js"></script>
  <script src="/gom/boot.js"></script>
</body>
</html>
